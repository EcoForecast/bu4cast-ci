name: Drivers Stage 3

on:
  schedule:
    - cron: '0 17 * * *' # runs at 12pm EST
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      OSN_KEY: ${{ secrets.OSN_KEY }}
      OSN_SECRET: ${{ secrets.OSN_SECRET }}
    container:
      image: eco4cast/rocker-neon4cast:latest
      options: --memory 45g
    steps:
      - uses: actions/checkout@v4
      
      - name: Install
        shell: Rscript {0}
        run: |
          install.packages("gdalcubes")
          remotes::install_github("cboettig/minioclient", upgrade = "never")
          
      - name: Download Pseudo
        shell: Rscript {0}
        run: |
          source("drivers/download_psuedo.R")

      - name: Generate Stage 3
        shell: Rscript {0}
        run: |
          source("drivers/generate_stage3.R")

      - name: Update Stage 3
        shell: Rscript {0}
        run: |
          source("drivers/update_stage3.R")

      - name: Healthcheck
        run: |
          apt-get install -y curl
          curl -m 10 --retry 5 https://hc-ping.com/49d4676e-7379-4699-ad40-f5d58df0ad95
